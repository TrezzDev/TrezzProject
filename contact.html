<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Contact — Ilham Ziqri." />
    <title>Contact — Trezz</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="font" href="assets/fonts/KHMenu.woff2" type="font/woff2" crossorigin />
    <link data-page-style rel="stylesheet" href="assets/css/contact.css" />
    <script src="assets/js/core/navigation.js" defer></script>
    <script src="assets/js/core/confirm-sfx.js" defer></script>
  </head>
  <body>
    <main class="contact-screen" aria-labelledby="contact-title" tabindex="-1">
      <section class="contact-panel">
        <header class="contact-header"><h1 id="contact-title">Contact</h1></header>
        <div class="contact-content">
          <dl class="contact-channels" aria-label="Kontak Ilham Ziqri">
            <div style="--channel-index: 0">
              <dt>
                <svg
                  class="contact-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  aria-hidden="true"
                >
                  <rect x="2.5" y="4.5" width="19" height="15" rx="2" />
                  <path d="m3 6 9 7 9-7" /></svg
                ><span>Email</span>
              </dt>
              <dd><a href="mailto:warungtrezz@gmail.com">warungtrezz@gmail.com</a></dd>
            </div>
            <div style="--channel-index: 1">
              <dt>
                <svg
                  class="contact-icon"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M16.7 1h-3.8v14.9a3.2 3.2 0 1 1-2.7-3.2V8.8a7 7 0 1 0 6.5 7V8.2a9.4 9.4 0 0 0 5.3 1.6V6a5.3 5.3 0 0 1-5.3-5Z"
                  /></svg
                ><span>TikTok</span>
              </dt>
              <dd></dd>
            </div>
            <div style="--channel-index: 2">
              <dt>
                <svg
                  class="contact-icon"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.85H15.8V14.1c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46v4.73H9.51V9.2h2.83v1.3h.04c.39-.74 1.36-1.53 2.8-1.53 3 0 3.57 1.98 3.57 4.55v5.23Z"
                  /></svg
                ><span>LinkedIn</span>
              </dt>
              <dd></dd>
            </div>
            <div style="--channel-index: 3">
              <dt>
                <svg
                  class="contact-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  aria-hidden="true"
                >
                  <rect x="3" y="3" width="18" height="18" rx="5" />
                  <circle cx="12" cy="12" r="4.2" />
                  <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" /></svg
                ><span>Instagram</span>
              </dt>
              <dd></dd>
            </div>
          </dl>
          <form class="contact-form" id="contact-form" aria-label="Kirim pesan ke Ilham Ziqri">
            <div class="contact-field">
              <label for="sender-email">Your email</label>
              <input
                id="sender-email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                maxlength="254"
                required
              />
            </div>
            <div class="contact-field">
              <label for="contact-message">Message</label>
              <textarea
                id="contact-message"
                name="message"
                rows="4"
                placeholder="Write your message here..."
                maxlength="3000"
                required
              ></textarea>
            </div>
            <button type="submit">
              Send to me
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <path d="m3 11 18-8-8 18-2-8-8-2Z M11 13 21 3" />
              </svg>
            </button>
            <p class="contact-form-note" id="contact-form-note" role="status">
              Opens your email app with the message ready to send.
            </p>
          </form>
        </div>
        <div class="contact-bottom-rule" aria-hidden="true"></div>
      </section>
    </main>
    <audio id="menu-sfx" src="assets/audio/menu-sfx.mp3" preload="auto"></audio>
    <audio id="confirm-sfx" src="assets/audio/confirm-sfx.mp3" preload="auto"></audio>
    <audio id="back-sfx" src="assets/audio/back-sfx.mp3" preload="auto"></audio>
  </body>
</html>
